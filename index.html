<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projection Tools — Calculateur de videoprojection</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <meta name="description" content="Calculateur de videoprojecteur interactif. Calculez la taille d'ecran, la distance de projection et trouvez le ratio ideal.">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body class="app-loading">

  <!-- ── Navbar ──────────────────────────────────────── -->
  <nav class="navbar">
    <a href="#" class="nav-brand">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </span>
      projection-tools
    </a>
    <div class="nav-actions">
      <button class="nav-btn" id="lang-toggle" aria-label="Toggle language">EN</button>
      <button class="nav-btn" id="theme-toggle" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </nav>

  <!-- ── Main Layout ─────────────────────────────────── -->
  <div class="app-container">
    <div class="main-layout">

      <!-- ── Controls Panel ──────────────────────────── -->
      <aside class="controls-panel">

        <!-- Projector Selector -->
        <div class="card">
          <div class="card-title">Videoprojecteur</div>
          <div class="projector-search-wrapper">
            <input type="text" class="projector-search" id="projector-search" placeholder="Rechercher un videoprojecteur..." autocomplete="off">
            <button class="search-clear" id="search-clear">&times;</button>
            <div class="projector-dropdown" id="projector-dropdown"></div>
          </div>

          <div class="filter-tags">
            <button class="filter-tag active" data-filter="all">Tous</button>
            <button class="filter-tag" data-filter="4K">4K</button>
            <button class="filter-tag" data-filter="1080p">1080p</button>
            <button class="filter-tag" data-filter="ust">UST</button>
            <button class="filter-tag" data-filter="short">Courte focale</button>
            <button class="filter-tag" data-filter="standard">Standard</button>
          </div>

          <div class="selected-projector" id="selected-projector">
            <span class="projector-chip">
              <span id="chip-name">BenQ W2700</span>
              <span class="chip-ratio" id="chip-ratio">1.13 - 1.47</span>
              <button class="chip-remove" id="chip-remove">&times;</button>
            </span>
          </div>

          <div class="manual-ratio-toggle">
            <input type="checkbox" class="toggle-checkbox" id="manual-toggle">
            <label for="manual-toggle" id="manual-label">Ratio manuel</label>
          </div>

          <div class="manual-ratio-inputs" id="manual-ratio-inputs">
            <div>
              <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:0.2rem" id="label-ratio-min">Ratio min</div>
              <input type="number" class="ratio-input" id="ratio-min" value="1.20" step="0.01" min="0.1" max="5">
            </div>
            <span class="ratio-separator">-</span>
            <div>
              <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:0.2rem" id="label-ratio-max">Ratio max</div>
              <input type="number" class="ratio-input" id="ratio-max" value="1.50" step="0.01" min="0.1" max="5">
            </div>
          </div>
        </div>

        <!-- Mode Tabs -->
        <div class="card">
          <div class="card-title">Mode de calcul</div>
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="distance">Distance &rarr; Taille</button>
            <button class="mode-tab" data-mode="screen">Taille &rarr; Distance</button>
            <button class="mode-tab" data-mode="ratio">Trouver le ratio</button>
          </div>

          <!-- Distance Slider (Mode A & C) -->
          <div class="slider-group" id="distance-group">
            <div class="slider-label">
              <span class="slider-label-text" id="label-distance">Distance de projection</span>
            </div>
            <div class="slider-row">
              <div class="slider-input-wrapper">
                <input type="range" id="distance-slider" min="0.1" max="15" step="0.01" value="3.0">
              </div>
              <input type="number" class="number-input" id="distance-number" min="0.1" max="15" step="0.01" value="3.0">
              <span class="input-unit">m</span>
            </div>
          </div>

          <!-- Diagonal Slider (Mode B) -->
          <div class="slider-group" id="diagonal-group" style="display:none">
            <div class="slider-label">
              <span class="slider-label-text" id="label-diagonal">Taille d'ecran souhaitee</span>
            </div>
            <div class="slider-row">
              <div class="slider-input-wrapper">
                <input type="range" id="diagonal-slider" min="30" max="600" step="1" value="120">
              </div>
              <input type="number" class="number-input" id="diagonal-number" min="30" max="600" step="1" value="120">
              <span class="input-unit">"</span>
            </div>
          </div>

          <!-- Width Slider (Mode C) -->
          <div class="slider-group" id="width-group" style="display:none">
            <div class="slider-label">
              <span class="slider-label-text" id="label-width">Largeur souhaitee</span>
            </div>
            <div class="slider-row">
              <div class="slider-input-wrapper">
                <input type="range" id="width-slider" min="100" max="1500" step="1" value="250">
              </div>
              <input type="number" class="number-input" id="width-number" min="50" max="1500" step="1" value="250">
              <span class="input-unit">cm</span>
            </div>
          </div>
        </div>

        <!-- Room Setup -->
        <div class="card">
          <div class="card-title" id="card-title-room">Configuration de la piece</div>

          <!-- Screen Height Slider -->
          <div class="slider-group" id="screen-height-group">
            <div class="slider-label">
              <span class="slider-label-text" id="label-screen-height">Hauteur de l'ecran</span>
            </div>
            <div class="slider-row">
              <div class="slider-input-wrapper">
                <input type="range" id="screen-height-slider" min="0.3" max="2.5" step="0.05" value="0.8">
              </div>
              <input type="number" class="number-input" id="screen-height-number" min="0.3" max="2.5" step="0.05" value="0.8">
              <span class="input-unit">m</span>
            </div>
          </div>

          <!-- Ceiling Height Slider -->
          <div class="slider-group" id="ceiling-height-group">
            <div class="slider-label">
              <span class="slider-label-text" id="label-ceiling-height">Hauteur du plafond</span>
            </div>
            <div class="slider-row">
              <div class="slider-input-wrapper">
                <input type="range" id="ceiling-height-slider" min="2.0" max="4.0" step="0.1" value="2.5">
              </div>
              <input type="number" class="number-input" id="ceiling-height-number" min="2.0" max="4.0" step="0.1" value="2.5">
              <span class="input-unit">m</span>
            </div>
          </div>
        </div>

        <!-- Results -->
        <div class="card results-card">
          <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
            <span>Resultats</span>
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="metric">cm/m</button>
              <button class="unit-btn" data-unit="imperial">in/ft</button>
            </div>
          </div>
          <div id="results-container">
            <!-- Results rendered here by JS -->
          </div>
          <div class="actions-row">
            <button class="action-btn" id="copy-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span class="btn-text">Copier</span>
            </button>
            <button class="action-btn" id="share-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              <span class="btn-text">Partager</span>
            </button>
          </div>
        </div>

      </aside>

      <!-- ── Visualization Panel ─────────────────────── -->
      <main class="visualization-panel">
        <div class="canvas-container">
          <span class="canvas-label" id="side-view-label">Vue de cote</span>
          <canvas id="side-canvas" data-type="side"></canvas>
        </div>
        <div class="canvas-container">
          <span class="canvas-label" id="front-view-label">Vue de face</span>
          <canvas id="front-canvas" data-type="front"></canvas>
        </div>
      </main>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
